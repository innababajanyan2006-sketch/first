<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Illusion Museum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --void:#0A0A0D;
  --wall:#151519;
  --wall-2:#1B1B21;
  --glass:rgba(255,255,255,0.045);
  --glass-b:rgba(255,255,255,0.09);
  --ink:#EEE9DF;
  --ink-dim:#A6A29A;
  --amber:#E8A33D;
  --amber-dim:#8A6323;
  --violet:#9884E8;
  --violet-dim:#4A4178;
  --line:rgba(238,233,223,0.10);
  --radius:2px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;}
body{
  margin:0;
  background:var(--void);
  color:var(--ink);
  font-family:'IBM Plex Sans', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,.serif{
  font-family:'Fraunces', Georgia, 'Times New Roman', serif;
  font-weight:600;
  letter-spacing:-0.01em;
  margin:0;
}
p{margin:0;line-height:1.6;color:var(--ink-dim);}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--amber);color:#1a1200;}

/* ---------- layout shell ---------- */
#topnav{
  position:fixed;top:0;left:0;right:0;z-index:50;
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);
  padding-bottom:14px;
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;
  padding-left:clamp(16px,4vw,40px);
  padding-right:clamp(16px,4vw,40px);
  background:linear-gradient(to bottom, rgba(10,10,13,0.92), rgba(10,10,13,0.7) 70%, transparent);
  backdrop-filter:blur(6px);
}
.brand{display:flex;align-items:baseline;gap:8px;cursor:pointer;}
.brand-mark{font-family:'Fraunces',serif;font-size:1.05rem;font-weight:600;letter-spacing:0.02em;}
.brand-mark em{font-style:normal;color:var(--amber);}
.navlinks{display:flex;gap:22px;align-items:center;}
.navlinks button{
  background:none;border:none;color:var(--ink-dim);font-size:0.86rem;
  padding:6px 2px;border-bottom:1px solid transparent;transition:color .2s, border-color .2s;
}
.navlinks button:hover, .navlinks button.active{color:var(--ink);border-color:var(--amber);}
.nav-right{display:flex;align-items:center;gap:10px;}
.icon-btn{
  background:var(--glass);border:1px solid var(--glass-b);color:var(--ink);
  padding:7px 12px;font-size:0.78rem;border-radius:var(--radius);
  display:flex;align-items:center;gap:6px;transition:border-color .2s, background .2s;
}
.icon-btn:hover{border-color:var(--amber);}
select#langsel{
  background:var(--glass);border:1px solid var(--glass-b);color:var(--ink);
  padding:7px 10px;font-size:0.78rem;border-radius:var(--radius);
}
.hamburger{display:none;background:none;border:1px solid var(--glass-b);color:var(--ink);padding:8px 10px;border-radius:var(--radius);}

#app{padding-top:0;}
.view{display:none;min-height:100vh;}
.view.active{display:block;}

.wrap{max-width:1080px;margin:0 auto;padding:0 clamp(16px,4vw,40px);}
.eyebrow{font-size:0.72rem;color:var(--amber);letter-spacing:0.08em;margin-bottom:10px;display:block;}
.section-title{font-size:clamp(1.6rem,3.4vw,2.4rem);margin-bottom:10px;}
.section-lede{max-width:56ch;margin-bottom:34px;}

/* ---------- hero ---------- */
#view-home{min-height:100vh;display:flex;flex-direction:column;justify-content:center;position:relative;}
.hero-glow{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 40% at 30% 20%, rgba(232,163,61,0.14), transparent 60%),
    radial-gradient(ellipse 50% 40% at 75% 65%, rgba(152,132,232,0.13), transparent 60%);
}
.hero-inner{position:relative;text-align:center;padding:120px 24px 80px;}
.hero-eyebrow{color:var(--ink-dim);font-size:0.82rem;letter-spacing:0.12em;margin-bottom:26px;}
.hero-title{
  font-size:clamp(3rem,10vw,7.2rem);line-height:0.92;
  background:linear-gradient(120deg, #fff 10%, var(--amber) 55%, var(--violet) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero-sub{margin:26px auto 44px;font-size:clamp(1rem,2vw,1.25rem);font-style:italic;color:var(--ink-dim);max-width:34ch;font-family:'Fraunces',serif;}
.enter-btn{
  background:var(--amber);color:#1a1200;border:none;padding:18px 42px;font-size:0.95rem;
  font-weight:600;letter-spacing:0.03em;border-radius:var(--radius);
  transition:transform .25s ease, box-shadow .25s ease;
  box-shadow:0 0 0 rgba(232,163,61,0);
}
.enter-btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px -8px rgba(232,163,61,0.5);}
.hero-hint{margin-top:28px;font-size:0.78rem;color:var(--ink-dim);opacity:0.7;}

/* ---------- museum map ---------- */
.room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:20px;}
.room-card{
  background:var(--wall);padding:26px 22px;min-height:170px;display:flex;flex-direction:column;justify-content:space-between;
  cursor:pointer;position:relative;overflow:hidden;transition:background .25s;
}
.room-card:hover{background:var(--wall-2);}
.room-card .rn{font-size:0.7rem;color:var(--amber);letter-spacing:0.06em;}
.room-card h3{font-size:1.2rem;margin-top:10px;}
.room-card p{font-size:0.82rem;margin-top:8px;}
.room-card .go{align-self:flex-end;font-size:1.2rem;color:var(--ink-dim);transition:transform .2s, color .2s;}
.room-card:hover .go{color:var(--amber);transform:translateX(4px);}

/* ---------- generic room view ---------- */
.room-hero{padding:130px 0 30px;border-bottom:1px solid var(--line);margin-bottom:40px;}
.room-crumb{font-size:0.76rem;color:var(--ink-dim);margin-bottom:14px;}
.room-crumb button{background:none;border:none;color:var(--ink-dim);text-decoration:underline;font-size:inherit;padding:0;}
.exhibit{
  background:var(--glass);border:1px solid var(--glass-b);border-radius:var(--radius);
  padding:clamp(20px,4vw,40px);margin-bottom:28px;
}
.exhibit-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
.exhibit-head h3{font-size:1.3rem;}
.stage{
  display:flex;align-items:center;justify-content:center;
  min-height:260px;background:var(--void);border:1px solid var(--line);
  margin:18px 0;position:relative;overflow:hidden;touch-action:none;
}
.hint-chip{
  position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,0.55);border:1px solid var(--glass-b);color:var(--ink);
  font-size:0.7rem;padding:6px 12px;border-radius:20px;backdrop-filter:blur(4px);
  pointer-events:none;
}
.controls-row{display:flex;flex-wrap:wrap;gap:20px;align-items:center;margin-top:16px;}
.control{display:flex;flex-direction:column;gap:6px;font-size:0.76rem;color:var(--ink-dim);min-width:160px;}
input[type=range]{accent-color:var(--amber);width:100%;}
.mini-btn{
  background:transparent;border:1px solid var(--glass-b);color:var(--ink);
  padding:9px 16px;font-size:0.78rem;border-radius:var(--radius);transition:border-color .2s;
}
.mini-btn:hover{border-color:var(--amber);}
.mini-btn.on{border-color:var(--violet);color:var(--violet);}
.heart-btn{background:none;border:none;color:var(--ink-dim);font-size:1rem;padding:4px;transition:color .2s, transform .2s;}
.heart-btn.saved{color:var(--amber);}
.heart-btn:hover{transform:scale(1.15);}

.explain{margin-top:14px;font-size:0.88rem;color:var(--ink-dim);border-left:2px solid var(--amber-dim);padding-left:14px;}

/* science accordion */
.science{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;}
.science-toggle{background:none;border:none;color:var(--violet);font-size:0.82rem;padding:0;display:flex;align-items:center;gap:6px;}
.science-body{display:none;margin-top:14px;}
.science-body.open{display:block;}
.sci-tabs{display:flex;gap:8px;margin-bottom:12px;}
.sci-tab{background:var(--glass);border:1px solid var(--glass-b);color:var(--ink-dim);font-size:0.72rem;padding:6px 12px;border-radius:20px;}
.sci-tab.active{color:var(--ink);border-color:var(--violet);}
.sci-pane{display:none;font-size:0.85rem;color:var(--ink-dim);line-height:1.65;}
.sci-pane.active{display:block;}

.room-nav{display:flex;justify-content:space-between;margin:50px 0 90px;gap:12px;flex-wrap:wrap;}

/* ---------- brain vs eyes / what-do-you-see cards ---------- */
.quiz-card{background:var(--glass);border:1px solid var(--glass-b);padding:clamp(20px,4vw,34px);margin-bottom:24px;border-radius:var(--radius);}
.quiz-q{font-family:'Fraunces',serif;font-size:1.15rem;margin-bottom:16px;}
.quiz-options{display:flex;gap:10px;flex-wrap:wrap;}
.quiz-opt{background:transparent;border:1px solid var(--glass-b);color:var(--ink);padding:10px 18px;border-radius:var(--radius);font-size:0.85rem;}
.quiz-opt:hover{border-color:var(--amber);}
.quiz-opt.picked{border-color:var(--violet);background:rgba(152,132,232,0.1);}
.reveal{display:none;margin-top:18px;padding-top:16px;border-top:1px dashed var(--line);}
.reveal.show{display:block;}
.reveal .verdict{color:var(--amber);font-family:'Fraunces',serif;font-size:1.05rem;margin-bottom:8px;}

/* ---------- challenge ---------- */
.challenge-progress{display:flex;gap:6px;margin-bottom:24px;}
.challenge-progress span{flex:1;height:3px;background:var(--line);}
.challenge-progress span.done{background:var(--amber);}
.challenge-progress span.now{background:var(--violet);}
.score-card{
  background:var(--glass);border:1px solid var(--glass-b);padding:44px;text-align:center;border-radius:var(--radius);
}
.score-num{font-family:'Fraunces',serif;font-size:4rem;color:var(--amber);}
.score-line{font-size:0.95rem;color:var(--ink-dim);margin-top:6px;}
.share-preview{
  margin:26px auto;max-width:380px;background:var(--void);border:1px solid var(--glass-b);
  padding:30px 24px;text-align:left;
}
.share-preview h4{font-family:'Fraunces',serif;font-size:1.15rem;margin-bottom:14px;}
.share-preview .row{display:flex;justify-content:space-between;font-size:0.85rem;color:var(--ink-dim);padding:6px 0;border-bottom:1px solid var(--line);}

/* ---------- collection ---------- */
.collect-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:24px;}
.collect-item{background:var(--glass);border:1px solid var(--glass-b);padding:18px;position:relative;}
.collect-item h4{font-size:1rem;margin-bottom:4px;}
.collect-item .rm{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--ink-dim);font-size:0.9rem;}
.empty-state{padding:60px 20px;text-align:center;color:var(--ink-dim);border:1px dashed var(--line);}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line);padding:40px clamp(16px,4vw,40px) calc(40px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--ink-dim);font-size:0.78rem;}

/* ---------- surprise floating btn ---------- */
#surprise-fab{
  position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;
  background:var(--violet);color:#100c20;border:none;padding:13px 20px;border-radius:30px;
  font-size:0.8rem;font-weight:600;box-shadow:0 8px 24px -6px rgba(152,132,232,0.6);
}

/* ---------- illusion-specific visuals ---------- */
/* room1: cafe wall */
.cw-canvas{display:flex;flex-direction:column;}
.cw-row{display:flex;height:20px;}
.cw-row div{width:20px;height:20px;}

/* room2: penrose morph */
.pz-wrap{position:relative;width:260px;height:260px;}
.pz-wrap svg{position:absolute;inset:0;transition:opacity .15s linear;}

/* room3: ebbinghaus */
.eb-wrap{display:flex;align-items:center;justify-content:center;gap:70px;}
.eb-center{background:var(--amber);border-radius:50%;}
.eb-ring{display:flex;align-items:center;justify-content:center;}
.eb-small{background:var(--ink-dim);border-radius:50%;}

/* room4: checker shadow */
.cs-grid{display:grid;grid-template-columns:repeat(8,32px);grid-template-rows:repeat(8,32px);position:relative;}
.cs-cell{width:32px;height:32px;}

/* room5: motion */
.mo-svg{animation:spin linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* room6: mirror canvas */
#mirrorCanvas{background:var(--void);touch-action:none;}

/* room7: 3d */
.scene3d{perspective:700px;}
.cube{position:relative;width:140px;height:140px;transform-style:preserve-3d;transition:transform .05s linear;}
.face{position:absolute;width:140px;height:140px;border:1px solid var(--violet);background:rgba(152,132,232,0.08);}
.f-front{transform:translateZ(70px);}
.f-back{transform:translateZ(-70px) rotateY(180deg);}
.f-right{transform:rotateY(90deg) translateZ(70px);}
.f-left{transform:rotateY(-90deg) translateZ(70px);}
.f-top{transform:rotateX(90deg) translateZ(70px);}
.f-bottom{transform:rotateX(-90deg) translateZ(70px);}

/* science hub */
.sci-group{margin-bottom:30px;}
.sci-group h4{font-family:'Fraunces',serif;font-size:1.1rem;margin-bottom:10px;color:var(--amber);}

/* reduced motion */
html.reduce-motion .mo-svg{animation:none !important;}
html.reduce-motion .enter-btn:hover{transform:none;}
html.reduce-motion *{transition-duration:0.001ms !important;}

/* responsive */
@media (max-width:720px){
  .navlinks{display:none;}
  .hamburger{display:block;}
  .room-grid{grid-template-columns:1fr 1fr;}
  .eb-wrap{gap:30px;}
  .cs-grid{grid-template-columns:repeat(6,26px);grid-template-rows:repeat(6,26px);}
  .cs-cell{width:26px;height:26px;}
}
@media (max-width:480px){
  .room-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<nav id="topnav">
  <div class="brand" onclick="go('home')">
    <span class="brand-mark">ILLUSION <em>MUSEUM</em></span>
  </div>
  <div class="navlinks" id="navlinks">
    <button onclick="go('home')" data-nav="home"></button>
    <button onclick="go('map')" data-nav="map"></button>
    <button onclick="go('challenge-intro')" data-nav="challenge"></button>
    <button onclick="go('science')" data-nav="science"></button>
    <button onclick="go('about')" data-nav="about"></button>
  </div>
  <div class="nav-right">
    <button class="icon-btn" onclick="go('collection')">♡ <span id="collect-label"></span></button>
    <select id="langsel" onchange="setLang(this.value)">
      <option value="hy">🇦🇲 Հայերեն</option>
      <option value="ru">🇷🇺 Русский</option>
      <option value="en">🇬🇧 English</option>
    </select>
  </div>
</nav>

<button id="surprise-fab" onclick="surpriseMe()"></button>

<div id="app"></div>

  r1:{title:"Café Wall Illusion",desc:"The rows below are made only of straight horizontal lines. Shift the offset and watch them tilt — even though every line stays perfectly parallel.",offset:"Row offset",check:"Show they're parallel",explainSimple:"Your eye reads the staggered light/dark edges as evidence of a slope, even though there isn't one.",explainScience:"Contrast between adjacent tiles activates edge-detecting neurons unevenly along each row, producing a perceived tilt — this is the classic Café Wall effect, first documented on a café's tiled wall in Bristol.",explainDeep:"Border-locking theory suggests the visual system's early orientation-selective cells respond to the luminance gradients at tile boundaries, and small local tilt signals sum into a global perceived skew — a Gestalt grouping effect layered on low-level contrast processing."},

  r1:{title:"Иллюзия «кафе-стена»",desc:"Ряды ниже состоят только из прямых горизонтальных линий. Сдвиньте смещение — и они словно наклонятся, хотя каждая линия остаётся строго параллельной.",offset:"Смещение ряда",check:"Показать, что они параллельны",explainSimple:"Глаз читает чередующиеся светлые и тёмные границы как признак наклона, которого на самом деле нет.",explainScience:"Контраст между соседними плитками неравномерно активирует нейроны, реагирующие на границы, создавая ощущение наклона — классический эффект «кафе-стены».",explainDeep:"Теория «блокировки границ» предполагает, что ранние ориентационно-чувствительные клетки реагируют на градиенты яркости на стыках плиток, а локальные сигналы наклона суммируются в общий перекос — эффект группировки поверх низкоуровневой обработки контраста."},
  r2:{title:"Невозможный треугольник",desc:"Этот треугольник не может существовать — каждый угол сам по себе выглядит правдоподобно, но вся фигура «работает» только с одной точки обзора. Потяните, чтобы повернуть угол обзора.",explainSimple:"Прямо в лоб мозг склеивает три угла в один цельный объект. Чуть сдвиньтесь — и обман раскрыт.",explainScience:"Треугольник Пенроуза использует привычку зрительной системы считать соединённые края частью одного жёсткого объекта — удобный приём, который ломается на фигуре, созданной специально для обмана проекции.",explainDeep:"Признаки глубины (перекрытие, стыки рёбер) локально непротиворечивы в каждом углу, но глобально противоречат друг другу — у фигуры нет единой согласованной 3D-интерпретации, только семейство локально правдоподобных 2D-проекций."},
  r3:{title:"Круги Эббингауза",desc:"Два оранжевых круга совершенно одинакового размера. Подвиньте ползунок, чтобы изменить окружающие круги, и понаблюдайте, как всё равно меняется восприятие.",explainSimple:"Большие соседи делают круг маленьким на вид. Маленькие соседи делают его большим. Круг тот же, размер тот же — ощущение другое.",explainScience:"Восприятие размера относительно, а не абсолютно — мозг оценивает размер объекта отчасти через сравнение с соседними объектами в том же зрительном контексте.",explainDeep:"Это часто приводят как пример контекстно-зависимого кодирования размера в ранних зрительных зонах, хотя точная нейронная основа эффекта всё ещё обсуждается исследователями восприятия."},
  r4:{title:"Один серый, две истории",desc:"Квадраты A и B — абсолютно одинакового оттенка серого. Подвиньте ползунок, чтобы изменить фон, и посмотрите, насколько по-разному они читаются.",connect:"Соединить A и B",explainSimple:"Мозг считывает не просто «сырой» цвет — он угадывает, каким цвет является «на самом деле», учитывая свет и тень.",explainScience:"Это одновременный контраст: одинаковые серые значения воспринимаются по-разному в зависимости от яркости непосредственного окружения.",explainDeep:"Классические иллюзии в духе «шахматной доски и тени» предполагают, что зрительная система выполняет нечто вроде автоматической константности светлоты — отбрасывая видимые тени и фон, чтобы оценить истинную отражательную способность поверхности, иногда в ущерб буквальной точности."},
  r5:{title:"Вращающееся поле",desc:"Этот узор на самом деле не вращается сам по себе — управляйте скоростью и направлением и заметьте, как ощущение движения задерживается, даже когда вы его останавливаете.",explainSimple:"Повторяющиеся узоры способны обмануть клетки, отвечающие за движение, заставив их «сообщить» о движении, которого нет.",explainScience:"Нейроны, детектирующие движение в ранней зрительной коре, реагируют на повторяющиеся контрастные границы так, что могут регистрировать кажущееся движение из статичного или медленно меняющегося изображения.",explainDeep:"Родственные последействия (например, иллюзия водопада) показывают, что длительное наблюдение движения в одном направлении смещает детекторы и порождает иллюзорное движение в обратном направлении после остановки стимула."},
  r6:{title:"Зеркало-калейдоскоп",desc:"Рисуйте в любом месте рамки — ваш штрих отражается вокруг центра. Измените симметрию, чтобы добавить больше отражений.",explainSimple:"Многократное отражение одной маленькой отметки создаёт узор, который выглядит гораздо сложнее, чем реально нарисованная вами линия.",explainScience:"Человеческое восприятие особенно чувствительно к симметрии — повторяющаяся, зеркальная структура воспринимается как сильный организующий признак (ключевой принцип гештальта).",explainDeep:"Считается, что обнаружение симметрии помогает быстрому разделению фигуры и фона и распознаванию объектов — возможно, поэтому симметричные узоры сразу кажутся «продуманными», даже если созданы одним случайным жестом."},
  r7:{title:"Парящий невозможный куб",desc:"Проведите мышью над кубом. Грани — просто плоские панели, но меняющиеся углы читаются как настоящая глубина.",explainSimple:"Несколько плоских прямоугольников, наклонённых нужным образом, — этого достаточно, чтобы мозг построил 3D-куб, которого на самом деле нет.",explainScience:"Признаки глубины из параллакса движения и перспективы настолько сильны, что даже грубый каркас способен вызвать устойчивое ощущение 3D.",explainDeep:"Это лёгкая CSS-3D-имитация на реальных перспективных трансформациях, а не полноценный 3D-движок — часть геометрической точности принесена в жертву скорости и отсутствию зависимостей."},

  r1:{title:"«Սրճարանի պատի» պատրանք",desc:"Ստորև գտնվող շարքերը կազմված են միայն ուղիղ հորիզոնական գծերից։ Փոխիր շեղումը և նկատիր, թե ինչպես են դրանք թեքվում, թեև յուրաքանչյուր գիծ մնում է կատարելապես զուգահեռ։",offset:"Շարքի շեղում",check:"Ցույց տալ, որ զուգահեռ են",explainSimple:"Աչքդ հերթափոխվող բաց ու մուգ եզրերը ընկալում է որպես թեքության վկայություն, թեև իրականում թեքություն չկա։",explainScience:"Հարևան սալիկների միջև կոնտրաստը անհավասարաչափ ակտիվացնում է եզրեր ճանաչող նեյրոնները, ինչը ստեղծում է ընկալվող թեքություն. սա «սրճարանի պատի» դասական էֆեկտն է։",explainDeep:"Եզրերի «կողպման» տեսությունը ենթադրում է, որ տեսողական համակարգի վաղ, կողմնորոշման նկատմամբ զգայուն բջիջները արձագանքում են սալիկների սահմանների պայծառության գրադիենտներին, և տեղային փոքր թեքության ազդանշանները գումարվում են ընդհանուր ընկալվող շեղման մեջ։"},
  r2:{title:"Անհնար եռանկյունին",desc:"Այս եռանկյունին չի կարող գոյություն ունենալ. յուրաքանչյուր անկյուն առանձին վավեր է թվում, բայց ամբողջ ձևը «աշխատում» է միայն մեկ ճշգրիտ կետից։ Քաշիր՝ դիտման անկյունը փոխելու համար և տես, թե ինչպես է այն քանդվում։",explainSimple:"Ուղիղ առջևից ուղեղդ երեք անկյունները միացնում է մեկ ամուր առարկայի։ Փոքր-ինչ շարժվելիս խաբեությունը բացահայտվում է։",explainScience:"Փենրոուզի եռանկյունին օգտագործում է տեսողական համակարգի այն ենթադրությունը, որ միացված եզրերը պատկանում են մեկ կոշտ առարկայի, ինչը ճիշտ է իրական տեսարանների համար, բայց քանդվում է հատուկ այդ խաբեության համար ստեղծված ձևի վրա։",explainDeep:"Խորության նշանները (ծածկում, եզրերի միացումներ) տեղայնորեն հետևողական են յուրաքանչյուր անկյունում, բայց ընդհանուր առմամբ հակասական. ձևը չունի մեկ միասնական եռաչափ մեկնաբանություն, այլ միայն տեղայնորեն վավեր երկչափ պրոյեկցիաների ընտանիք։"},
  r3:{title:"Էբինգհաուզի շրջանները",desc:"Երկու նարնջագույն շրջանները ճշգրիտ նույն չափի են։ Քաշիր սահիչը՝ շրջապատող շրջանների չափը փոխելու համար և նկատիր, թե ինչպես է ընկալումդ, այնուամենայնիվ, փոխվում։",explainSimple:"Մեծ հարևանները շրջանը փոքր են ցույց տալիս։ Փոքր հարևանները՝ մեծ։ Նույն շրջանը, նույն չափը, այլ զգացողություն։",explainScience:"Չափի ընկալումը հարաբերական է, ոչ բացարձակ. ուղեղը առարկայի չափը գնահատում է մասամբ այն նույն տեսողական համատեքստում գտնվող մոտակա առարկաների հետ համեմատելով։",explainDeep:"Սա հաճախ բերվում է որպես վաղ տեսողական գոտիներում համատեքստից կախված չափի կոդավորման ապացույց, թեև էֆեկտի ճշգրիտ նյարդային հիմքը դեռ քննարկվում է ընկալման հետազոտողների կողմից։"},
  r4:{title:"Նույն մոխրագույնը, երկու պատմություն",desc:"A և B քառակուսիները ճշգրիտ նույն երանգի մոխրագույն են։ Շարժիր սահիչը՝ ֆոնը փոխելու համար և տես, թե որքան տարբեր են դրանք ընկալվում։",connect:"Միացնել A-ն և B-ն",explainSimple:"Ուղեղդ պարզապես չի կարդում հում գույնը, այլ գուշակում է, թե ինչ գույն է առարկան «իրականում», հաշվի առնելով լույսն ու ստվերը։",explainScience:"Սա միաժամանակյա կոնտրաստ է. նույնական մոխրագույն արժեքները տարբեր կերպ են ընկալվում՝ կախված անմիջական շրջապատի պայծառությունից։",explainDeep:"«Շախմատային տախտակ-ստվեր» ոճի դասական պատրանքները ենթադրում են, որ տեսողական համակարգը կատարում է մի տեսակ ինքնաբերական լուսավորության հաստատունություն՝ հաշվարկից հանելով երևացող ստվերներն ու շրջապատող պայծառությունը, երբեմն ի հաշիվ բառացի ճշգրտության։"},
  r5:{title:"Պտտվող դաշտ",desc:"Այս նախշը իրականում ինքն իրենից չի պտտվում. կառավարիր արագությունն ու ուղղությունը և նկատիր, թե ինչպես շարժման զգացողությունը մնում է անգամ դադարեցնելուց հետո։",explainSimple:"Կրկնվող նախշերը կարող են խաբել շարժում ընկալող բջիջներին՝ ստիպելով «հաղորդել» շարժման մասին, որը իրականում գոյություն չունի։",explainScience:"Վաղ տեսողական կեղևի շարժում հայտնաբերող նեյրոնները արձագանքում են կրկնվող կոնտրաստային եզրերին այնպես, որ կարող են գրանցել թվացյալ շարժում զուտ ստատիկ կամ դանդաղ փոփոխվող մուտքից։",explainDeep:"Առնչվող հետէֆեկտները (օրինակ՝ ջրվեժի պատրանքը) ցույց են տալիս, որ մեկ ուղղությամբ շարժման երկարատև դիտումը կարող է շեղել դետեկտորները և առաջացնել պատրանքային շարժում հակառակ ուղղությամբ՝ գրգռիչը դադարելուց հետո։"},
  r6:{title:"Կալեիդոսկոպ հայելի",desc:"Նկարիր շրջանակի ցանկացած կետում. քո գիծը արտացոլվում է կենտրոնի շուրջ։ Փոխիր համաչափությունը՝ ավելի շատ արտացոլումներ ստանալու համար։",explainSimple:"Մեկ փոքրիկ նշանի կրկնվող արտացոլումը ստեղծում է նախշ, որը շատ ավելի բարդ է թվում, քան իրականում գծված մեկ գիծը։",explainScience:"Մարդու ընկալումը հատկապես զգայուն է համաչափության նկատմամբ. կրկնվող, հայելային կառուցվածքը ընկալվում է որպես ուժեղ կազմակերպող նշան (գեշտալտի հիմնական սկզբունքներից մեկը)։",explainDeep:"Ենթադրվում է, որ համաչափության հայտնաբերումն օգնում է արագ առանձնացնել կերպարը ֆոնից և ճանաչել առարկաները, ինչը գուցե բացատրում է, թե ինչու համաչափ նախշերն անմիջապես թվում են «մտածված», նույնիսկ եթե ստեղծված են մեկ պատահական շարժումից։"},
  r7:{title:"Լողացող անհնար խորանարդ",desc:"Անցկացրու մկնիկը խորանարդի վրայով։ Երեսները պարզապես հարթ վահանակներ են, բայց փոփոխվող անկյունները ընկալվում են որպես իրական խորություն։",explainSimple:"Մի քանի հարթ ուղղանկյուններ, ճիշտ թեքված, բավական են, որպեսզի ուղեղդ կառուցի 3D խորանարդ, որը իրականում գոյություն չունի։",explainScience:"Շարժման պարալլաքսից և հեռանկարից եկող խորության նշանները այնքան ուժեղ են, որ նույնիսկ կոպիտ կմախքային պատկերը կարող է առաջացնել ուժեղ 3D զգացողություն։",explainDeep:"Սա թեթև CSS-3D մոտարկում է, որն օգտագործում է իրական հեռանկարային փոխակերպումներ, ոչ թե լիարժեք 3D շարժիչ. որոշ երկրաչափական ճշգրտություն զոհաբերվում է արագ, կախվածություններից զերծ փորձի համար։"},

let lang = localStorage.getItem('im_lang') || 'hy';
document.getElementById('langsel').value = lang;

function t(key){
  const parts = key.split('.');
  let obj = I18N[lang];
  for(const p of parts){ obj = obj ? obj[p] : undefined; }
  return obj === undefined ? key : obj;
}

function setLang(l){
  lang = l;
  localStorage.setItem('im_lang', l);
  document.getElementById('langsel').value = l;
  renderChrome();
  render();
}

/* ============================= STATE ============================= */
const ROOM_IDS = ['r1','r2','r3','r4','r5','r6','r7'];
let collection = JSON.parse(localStorage.getItem('im_collection') || '[]');
function isSaved(id){ return collection.includes(id); }
function toggleSave(id){
  if(isSaved(id)) collection = collection.filter(x=>x!==id);
  else collection.push(id);
  localStorage.setItem('im_collection', JSON.stringify(collection));
  render();
}
const SAVEABLE_TITLES = {}; // filled per-view for collection display

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reduceMotion) document.documentElement.classList.add('reduce-motion');

let route = location.hash.replace('#','') || 'home';
window.addEventListener('hashchange', ()=>{ route = location.hash.replace('#','') || 'home'; render(); window.scrollTo(0,0); });
function go(r){ location.hash = r; }

/* ============================= CHROME (nav) ============================= */
function renderChrome(){
  const n = I18N[lang].nav;
  document.querySelector('[data-nav="home"]').textContent = n.home;
  document.querySelector('[data-nav="map"]').textContent = n.map;
  document.querySelector('[data-nav="challenge"]').textContent = n.challenge;
  document.querySelector('[data-nav="science"]').textContent = n.science;
  document.querySelector('[data-nav="about"]').textContent = n.about;
  document.getElementById('collect-label').textContent = n.collectShort;
  document.getElementById('surprise-fab').textContent = (lang==='hy'?'ԶԱՐՄԱՑՐՈՒ ԻՆՁ':lang==='ru'?'УДИВИ МЕНЯ':'SURPRISE ME');
}

function surpriseMe(){
  const pool = [...ROOM_IDS.map(r=>'room-'+r), 'bve', 'wdys'];
  const pick = pool[Math.floor(Math.random()*pool.length)];
  go(pick);
}

/* ============================= RENDER ROUTER ============================= */
function render(){
  const app = document.getElementById('app');
  let html = '';
  const base = route.split('/')[0];
  document.querySelectorAll('.navlinks button').forEach(b=>b.classList.remove('active'));

  if(base === 'home') { html = viewHome(); }
  else if(base === 'map') { html = viewMap(); mark('map'); }
  else if(base === 'room-r1'){ html = viewRoom('r1'); mark('map'); }
  else if(base === 'room-r2'){ html = viewRoom('r2'); mark('map'); }
  else if(base === 'room-r3'){ html = viewRoom('r3'); mark('map'); }
  else if(base === 'room-r4'){ html = viewRoom('r4'); mark('map'); }
  else if(base === 'room-r5'){ html = viewRoom('r5'); mark('map'); }
  else if(base === 'room-r6'){ html = viewRoom('r6'); mark('map'); }
  else if(base === 'room-r7'){ html = viewRoom('r7'); mark('map'); }
  else if(base === 'bve'){ html = viewBVE(); }
  else if(base === 'wdys'){ html = viewWDYS(); }
  else if(base === 'challenge-intro'){ html = viewChallengeIntro(); mark('challenge'); }
  else if(base === 'challenge-play'){ html = viewChallengePlay(); mark('challenge'); }
  else if(base === 'challenge-score'){ html = viewChallengeScore(); mark('challenge'); }
  else if(base === 'science'){ html = viewScience(); mark('science'); }
  else if(base === 'collection'){ html = viewCollection(); }
  else if(base === 'about'){ html = viewAbout(); mark('about'); }
  else { html = viewHome(); }

  app.innerHTML = html;
  window.scrollTo(0,0);
  afterRender(base);
}
function mark(name){ const el=document.querySelector('[data-nav="'+name+'"]'); if(el) el.classList.add('active'); }

/* ============================= VIEWS ============================= */
function viewHome(){
  const h = I18N[lang].hero;
  return `
  <section class="view active" id="view-home">
    <div class="hero-glow"></div>
    <div class="hero-inner">
      <div class="hero-eyebrow">${h.eyebrow}</div>
      <h1 class="hero-title">${h.title}</h1>
      <p class="hero-sub">"${h.sub}"</p>
      <button class="enter-btn" onclick="go('map')">${h.enter}</button>
      <p class="hero-hint">${h.hint}</p>
    </div>
  </section>`;
}

function roomDescriptor(id){
  const idx = ROOM_IDS.indexOf(id)+1;
  return { num: String(idx).padStart(2,'0'), meta: I18N[lang].rooms[id] };
}

function viewMap(){
  const m = I18N[lang].map;
  let cards = ROOM_IDS.map(id=>{
    const d = roomDescriptor(id);
    return `<div class="room-card" onclick="go('room-${id}')">
      <div>
        <span class="rn">${d.num}</span>
        <h3>${d.meta.name}</h3>
        <p>${d.meta.short}</p>
      </div>
      <span class="go">→</span>
    </div>`;
  }).join('');
  return `
  <section class="view active">
    <div class="room-hero wrap">
      <span class="eyebrow">${m.eyebrow}</span>
      <h2 class="section-title">${m.title}</h2>
      <p class="section-lede">${m.lede}</p>
    </div>
    <div class="wrap">
      <div class="room-grid">${cards}</div>
    </div>
    <footer>${I18N[lang].about.privacy}</footer>
  </section>`;
}

function exhibitShell(id, roomKey, innerStage, controlsHtml, hintKey){
  const r = I18N[lang][roomKey];
  const saved = isSaved(roomKey);
  const c = I18N[lang].common;
  return `
  <div class="exhibit">
    <div class="exhibit-head">
      <h3>${r.title}</h3>
      <button class="heart-btn ${saved?'saved':''}" onclick="toggleSave('${roomKey}')" title="${saved?c.saved:c.save}">${saved?'♥':'♡'}</button>
    </div>
    <p>${r.desc}</p>
    <div class="stage" id="stage-${roomKey}">
      ${innerStage}
      ${hintKey ? `<div class="hint-chip">${hintKey}</div>` : ''}
    </div>
    ${controlsHtml||''}
    <div class="science">
      <button class="science-toggle" onclick="toggleSci('${roomKey}')">▸ ${c.howItWorks}</button>
      <div class="science-body" id="sci-${roomKey}">
        <div class="sci-tabs">
          <button class="sci-tab active" onclick="sciTab('${roomKey}','simple')">${c.simple}</button>
          <button class="sci-tab" onclick="sciTab('${roomKey}','science')">${c.science}</button>
          <button class="sci-tab" onclick="sciTab('${roomKey}','deep')">${c.deep}</button>
        </div>
        <div class="sci-pane active" id="sci-${roomKey}-simple">${r.explainSimple}</div>
        <div class="sci-pane" id="sci-${roomKey}-science">${r.explainScience}</div>
        <div class="sci-pane" id="sci-${roomKey}-deep">${r.explainDeep}</div>
      </div>
    </div>
  </div>`;
}
function toggleSci(id){
  document.getElementById('sci-'+id).classList.toggle('open');
}
function sciTab(id, tab){
  document.querySelectorAll('#sci-'+id+' .sci-tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('#sci-'+id+' .sci-pane').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('sci-'+id+'-'+tab).classList.add('active');
}

function viewRoom(id){
  const d = roomDescriptor(id);
  const c = I18N[lang].common;
  const idx = ROOM_IDS.indexOf(id);
  const prevId = ROOM_IDS[(idx-1+ROOM_IDS.length)%ROOM_IDS.length];
  const nextId = ROOM_IDS[(idx+1)%ROOM_IDS.length];

  let exhibitHtml = '';
  if(id==='r1') exhibitHtml = exhibitR1();
  if(id==='r2') exhibitHtml = exhibitR2();
  if(id==='r3') exhibitHtml = exhibitR3();
  if(id==='r4') exhibitHtml = exhibitR4();
  if(id==='r5') exhibitHtml = exhibitR5();
  if(id==='r6') exhibitHtml = exhibitR6();
  if(id==='r7') exhibitHtml = exhibitR7();

  return `
  <section class="view active">
    <div class="room-hero wrap">
      <div class="room-crumb"><button onclick="go('map')">${c.back}</button></div>
      <span class="eyebrow">${d.num} — ${I18N[lang].rooms[id].name.toUpperCase()}</span>
      <h2 class="section-title">${I18N[lang].rooms[id].name}</h2>
    </div>
    <div class="wrap">
      ${exhibitHtml}
      <div class="room-nav">
        <button class="mini-btn" onclick="go('room-${prevId}')">${c.prev}</button>
        <button class="mini-btn" onclick="go('room-${nextId}')">${c.next}</button>
      </div>
    </div>
    <footer>${I18N[lang].about.privacy}</footer>
  </section>`;
}

/* ---- R1: cafe wall ---- */
function exhibitR1(){
  const r = I18N[lang].r1, c = I18N[lang].common;
  const rows = 8, cols = 16;
  let rowsHtml = '';
  for(let ri=0;ri<rows;ri++){
    rowsHtml += `<div class="cw-row" data-row="${ri}">`;
    for(let ci=0;ci<cols;ci++){
      rowsHtml += `<div style="background:${ci%2===0?'#EEE9DF':'#0A0A0D'}"></div>`;
    }
    rowsHtml += `</div>`;
  }
  const stage = `<div class="cw-canvas" id="cwCanvas" style="border-top:2px solid #444;border-bottom:2px solid #444;">${rowsHtml}</div>`;
  const controls = `<div class="controls-row">
    <div class="control"><label>${r.offset}</label><input type="range" id="cwOffset" min="0" max="10" value="0" oninput="cwUpdate(this.value)"></div>
    <button class="mini-btn" id="cwCheckBtn" onclick="cwCheck()">${r.check}</button>
  </div>`;
  return exhibitShell('r1','r1',stage,controls,I18N[lang].rooms.r1.hint);
}
function cwUpdate(v){
  document.querySelectorAll('#cwCanvas .cw-row').forEach((row,i)=>{
    const off = (i%2===0) ? 0 : v;
    row.style.transform = `translateX(${off*2}px)`;
    row.style.borderTop = i>0 ? '2px solid #555' : 'none';
  });
}
let cwChecked=false;
function cwCheck(){
  cwChecked=!cwChecked;
  document.querySelectorAll('#cwCanvas .cw-row').forEach((row)=>{
    row.style.borderTop = cwChecked ? '1px solid #E8A33D' : 'none';
  });
}

/* ---- R2: impossible triangle morph ---- */
function exhibitR2(){
  const r = I18N[lang].r2;
  const triangleSvg = (broken)=>`
    <svg viewBox="0 0 240 220" width="240" height="220">
      <g stroke="#E8A33D" stroke-width="3" fill="rgba(232,163,61,0.06)">
        <path d="M120 20 L${broken?40:20} 190 L${broken?200:220} 190 Z" />
        <path d="M120 20 L60 160 L100 160 L140 60 Z" fill="rgba(152,132,232,0.12)" stroke="#9884E8"/>
        <path d="M60 190 L180 190 L150 130 L90 130 Z" fill="rgba(238,233,223,0.08)" stroke="#EEE9DF"/>
      </g>
    </svg>`;
  const stage = `<div class="pz-wrap"><div id="pzA">${triangleSvg(false)}</div><div id="pzB" style="opacity:0;position:absolute;inset:0;">${triangleSvg(true)}</div></div>`;
  const controls = `<div class="controls-row">
    <div class="control"><label>${I18N[lang].common.angle}</label><input type="range" id="pzAngle" min="0" max="100" value="0" oninput="pzUpdate(this.value)"></div>
  </div>`;
  return exhibitShell('r2','r2',stage,controls,I18N[lang].rooms.r2.hint);
}
function pzUpdate(v){
  const b = document.getElementById('pzB');
  const a = document.getElementById('pzA');
  if(!b) return;
  b.style.opacity = v/100;
  a.style.opacity = 1-(v/100*0.7);
  document.getElementById('pzA').parentElement.style.transform = `rotate(${v*0.6}deg)`;
}

/* ---- R6: mirror canvas ---- */
function exhibitR6(){
  const r = I18N[lang].r6;
  const stage = `<canvas id="mirrorCanvas" width="320" height="260"></canvas>`;
  const controls = `<div class="controls-row">
    <div class="control"><label>${I18N[lang].common.symmetry}</label>
      <input type="range" id="mrSym" min="2" max="10" step="2" value="6" oninput="mrSymUpdate()"></div>
    <button class="mini-btn" onclick="mrClear()">${I18N[lang].common.clear}</button>
  </div>`;
  return exhibitShell('r6','r6',stage,controls,I18N[lang].rooms.r6.hint);
}
let mrCtx, mrDrawing=false, mrSym=6;
function initMirror(){
  const cv = document.getElementById('mirrorCanvas');
  if(!cv) return;
  mrCtx = cv.getContext('2d');
  mrCtx.fillStyle = '#0A0A0D'; mrCtx.fillRect(0,0,cv.width,cv.height);
  mrCtx.lineWidth = 2.5; mrCtx.lineCap='round';
  const pos = e=>{
    const rect = cv.getBoundingClientRect();
    const cx = (e.touches?e.touches[0].clientX:e.clientX) - rect.left;
    const cy = (e.touches?e.touches[0].clientY:e.clientY) - rect.top;
    return {x:cx,y:cy};
  };
  let last=null;
  const start = e=>{ mrDrawing=true; last=pos(e); e.preventDefault(); };
  const move = e=>{
    if(!mrDrawing) return;
    const p = pos(e);
    drawMirrored(last,p);
    last = p;
    e.preventDefault();
  };
  const end = ()=>{ mrDrawing=false; last=null; };
  cv.addEventListener('mousedown',start); cv.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
  cv.addEventListener('touchstart',start,{passive:false}); cv.addEventListener('touchmove',move,{passive:false}); cv.addEventListener('touchend',end);
}
function drawMirrored(p0,p1){
  const cx = mrCtx.canvas.width/2, cy = mrCtx.canvas.height/2;
  const hue = 30 + (Date.now()/20 % 260);
  mrCtx.strokeStyle = `hsl(${hue},70%,65%)`;
  for(let i=0;i<mrSym;i++){
    const ang = (i/mrSym)*2*Math.PI;
    const rot = (pt)=>{
      const dx = pt.x-cx, dy = pt.y-cy;
      const rx = dx*Math.cos(ang)-dy*Math.sin(ang);
      const ry = dx*Math.sin(ang)+dy*Math.cos(ang);
      return {x:cx+rx,y:cy+ry};
    };
    const a0 = rot(p0), a1 = rot(p1);
    mrCtx.beginPath(); mrCtx.moveTo(a0.x,a0.y); mrCtx.lineTo(a1.x,a1.y); mrCtx.stroke();
    const mrr = (pt)=>({x: cx-(pt.x-cx), y: pt.y});
    const b0 = rot(mrr(p0)), b1 = rot(mrr(p1));
    mrCtx.beginPath(); mrCtx.moveTo(b0.x,b0.y); mrCtx.lineTo(b1.x,b1.y); mrCtx.stroke();
  }
}
function mrSymUpdate(){ mrSym = Number(document.getElementById('mrSym').value); }
function mrClear(){
  if(!mrCtx) return;
  mrCtx.fillStyle = '#0A0A0D'; mrCtx.fillRect(0,0,mrCtx.canvas.width,mrCtx.canvas.height);
}

function init3d(){
  const wrap = document.getElementById('sceneWrap');

  if(!wrap||!cube) return;
  wrap.addEventListener('mousemove', e=>{
    const rect = wrap.getBoundingClientRect();
    const px = (e.clientX-rect.left)/rect.width - 0.5;
    const py = (e.clientY-rect.top)/rect.height - 0.5;
    cube.style.transform = `rotateY(${px*80}deg) rotateX(${-py*80}deg)`;
  });
  wrap.addEventListener('mouseleave', ()=>{ cube.style.transform = 'rotateY(25deg) rotateX(-15deg)'; });

}

/* ============================= CHALLENGE ============================= */
const CHALLENGE_POOL = ['q1','q2','q3']; // base bve pool reused + extra generated variants below
function buildChallengeSet(){
  // build 10 rounds by cycling bve-style questions with slight variety flags
  const base = ['q1','q2','q3'];
  const set = [];
  for(let i=0;i<10;i++){ set.push(base[i%base.length]); }
  return set;
}
let challengeState = null;
function viewChallengeIntro(){
  const ch = I18N[lang].challenge;
  return `
  <section class="view active">
    <div class="room-hero wrap">
      <span class="eyebrow">${ch.eyebrow}</span>
      <h2 class="section-title">${ch.title}</h2>
      <p class="section-lede">${ch.lede}</p>
      <button class="enter-btn" onclick="startChallenge()">${ch.start}</button>
    </div>
    <footer>${I18N[lang].about.privacy}</footer>
  </section>`;
}
function startChallenge(){
  challengeState = { set: buildChallengeSet(), idx:0, fooled:0, solved:0, answered:false };
  go('challenge-play');
}
function viewChallengePlay(){
  if(!challengeState){ startChallenge(); }
  const ch = I18N[lang].challenge;
  const qid = challengeState.set[challengeState.idx];
  const q = I18N[lang].bve[qid];
  let progress = '';
  for(let i=0;i<10;i++){
    progress += `<span class="${i<challengeState.idx?'done':(i===challengeState.idx?'now':'')}"></span>`;
  }
  return `
  <section class="view active">
    <div class="room-hero wrap" style="padding-top:110px;">
      <span class="eyebrow">${ch.eyebrow} — ${ch.question} ${challengeState.idx+1} ${ch.of} 10</span>
      <div class="challenge-progress">${progress}</div>
    </div>
    <div class="wrap">
      <div class="quiz-card">
        <div class="quiz-q">${q.q}</div>
        <div class="stage" style="min-height:160px;">${bveVisual(qid)}</div>
        <div class="quiz-options" id="ch-opts">
          <button class="quiz-opt" onclick="chPick('optA',this)">${q.optA}</button>
          <button class="quiz-opt" onclick="chPick('optB',this)">${q.optB}</button>
          <button class="quiz-opt" onclick="chPick('optC',this)">${q.optC}</button>
        </div>
        <div class="reveal" id="ch-reveal">
          <div class="verdict">${q.verdict}</div>
          <p>${q.explain}</p>
          <div style="margin-top:18px;">
            <button class="mini-btn" onclick="chNext()">${challengeState.idx<9?ch.next:ch.finish}</button>
          </div>
        </div>
      </div>
    </div>
    <footer>${I18N[lang].about.privacy}</footer>
  </section>`;
}
function chPick(opt, el){
  if(challengeState.answered) return;
  challengeState.answered = true;
  document.querySelectorAll('#ch-opts .quiz-opt').forEach(b=>b.classList.remove('picked'));
  el.classList.add('picked');
  const qid = challengeState.set[challengeState.idx];
  const q = I18N[lang].bve[qid];
  if(opt === q.correct) challengeState.solved++; else challengeState.fooled++;
  document.getElementById('ch-reveal').classList.add('show');
}
function chNext(){
  challengeState.idx++;
  challengeState.answered = false;
  if(challengeState.idx >= 10){ go('challenge-score'); }
  else { render(); }
}
function viewChallengeScore(){
  if(!challengeState){ return viewChallengeIntro(); }
  const ch = I18N[lang].challenge;
  const solved = challengeState.solved, fooled = challengeState.fooled;
  const msgIdx = solved>=8?3:solved>=5?2:solved>=3?1:0;
  return `
  <section class="view active">
    <div class="room-hero wrap">
      <span class="eyebrow">${ch.eyebrow}</span>
      <h2 class="section-title">${ch.scoreTitle}</h2>
    </div>
    <div class="wrap">
      <div class="score-card">
        <div class="score-num">${solved}/10</div>
        <div class="score-line">${ch.messages[msgIdx]}</div>
        <div class="share-preview">
          <h4>${ch.shareTitle}</h4>
          <div class="row"><span>${ch.illusionsLabel}</span><span>10</span></div>
          <div class="row"><span>${ch.fooledLabel}</span><span>${fooled}</span></div>
          <div class="row"><span>${ch.solvedLabel}</span><span>${solved}</span></div>
        </div>
        <button class="enter-btn" onclick="shareResult(${solved},${fooled})">${ch.share}</button>
        <div style="margin-top:16px;">
          <button class="mini-btn" onclick="startChallenge()">${ch.playAgain}</button>
        </div>
      </div>
    </div>
    <footer>${I18N[lang].about.privacy}</footer>
  </section>`;
}
function shareResult(solved, fooled){
  const ch = I18N[lang].challenge;
  const text = `${ch.shareTitle}\n10 ${ch.illusionsLabel} · ${fooled} ${ch.fooledLabel} · ${solved} ${ch.solvedLabel}`;
  if(navigator.share){
    navigator.share({text}).catch(()=>{});
  } else if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(()=>alert(ch.copied));
  }
}
